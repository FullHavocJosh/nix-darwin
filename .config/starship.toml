add_newline = false
# A minimal left prompt
format = """$directory$git_branch$git_status
$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """$time$hostname$aws$golang$python$kubernetes$docker_context$cmd_duration$jobs$battery$status$container$shell"""
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[>--➜](bold green)'

[git_branch]
disabled = false
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = 'red'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?'
stashed = '≡'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'

[aws]
format = '[$symbol(profile: $profile )\[$region\]]($style)'
disabled = true
style = 'bold peach'
symbol = " "
region_aliases = { "us-east-1" = "ue1", "us-west-2" = "uw2", "eu-west-1" = "ew1" }

[golang]
disabled = true
format = '[ ](bold cyan)'

[python]
disabled = true

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '
contexts = [
  { context_pattern = "arn:aws:eks:us-west-2:577926974532:cluster/zd-pvc-omer", style = "green", context_alias = "omerxx", symbol = " " },
]

[docker_context]
disabled = true

[time]
disabled = false
format = '[$time]($style) '
style = 'overlay1'
time_format = '%H:%M:%S'

[hostname]
ssh_only = false
format = '[@$hostname]($style) '
style = 'bold blue'
disabled = false

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
