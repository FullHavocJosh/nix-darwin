config-version = 2
after-login-command = []
after-startup-command = []
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 90
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'
key-mapping.preset = 'qwerty'

persistent-workspaces = [
    'Development', 'Browser', 'Communication', 'Audio-Video', 'Nix-Darwin',
    '1st-Workspace', '2nd-Workspace', '3rd-Workspace', '4th-Workspace', '5th-Workspace',
]

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin'

[gaps]
inner.horizontal = 16
inner.vertical = 16
outer.left = 16
outer.bottom = 16
outer.top = 16
outer.right = 16

[workspace-to-monitor-force-assignment]
"Communication" = ['main']
"Audio-Video" = ['main']
"Development" = ['main']
"Nix-Darwin" = ['main']
"Browser" = ['main']
"1st-Workspace" = ['secondary']
"2nd-Workspace" = ['secondary']
"3rd-Workspace" = ['secondary']
"4th-Workspace" = ['secondary']
"5th-Workspace" = ['secondary']

[mode.main.binding]
cmd-h = []
cmd-alt-h = []
alt-enter = '''exec-and-forget osascript -e '
tell application "Ghostty"
    new window
end tell'
'''
alt-z = 'exec-and-forget open -na /Applications/Zen.app'
alt-s = 'exec-and-forget open -na /Applications/Slack.app'
alt-e = 'exec-and-forget open -na /Applications/Element.app'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-left = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-down = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-up = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'
alt-right = 'focus --boundaries-action wrap-around-the-workspace right'
alt-shift-h = 'move left'
alt-shift-left = 'move left'
alt-shift-j = 'move down'
alt-shift-down = 'move down'
alt-shift-k = 'move up'
alt-shift-up = 'move up'
alt-shift-l = 'move right'
alt-shift-right = 'move right'
alt-d = 'workspace "Development"'
alt-x = 'workspace "Nix-Darwin"'
alt-c = 'workspace "Communication"'
alt-b = 'workspace "Browser"'
alt-a = 'workspace "Audio-Video"'
alt-1 = 'workspace "1st-Workspace"'
alt-2 = 'workspace "2nd-Workspace"'
alt-3 = 'workspace "3rd-Workspace"'
alt-4 = 'workspace "4th-Workspace"'
alt-5 = 'workspace "5th-Workspace"'
alt-shift-d = 'move-node-to-workspace "Development"'
alt-shift-x = 'move-node-to-workspace "Nix-Darwin"'
alt-shift-c = 'move-node-to-workspace "Communication"'
alt-shift-b = 'move-node-to-workspace "Browser"'
alt-shift-a = 'move-node-to-workspace "Audio-Video"'
alt-shift-1 = 'move-node-to-workspace "1st-Workspace"'
alt-shift-2 = 'move-node-to-workspace "2nd-Workspace"'
alt-shift-3 = 'move-node-to-workspace "3rd-Workspace"'
alt-shift-4 = 'move-node-to-workspace "4th-Workspace"'
alt-shift-5 = 'move-node-to-workspace "5th-Workspace"'
alt-shift-f = 'layout floating tiling'
alt-shift-equal = 'balance-sizes'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-semicolon = 'mode service'
alt-shift-r = 'mode resize'

# PiP must precede the general Zen rule so both fire: first float, then move to Browser
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = 'Picture-in-Picture'
run = ['layout floating']

# Development
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace Development']

[[on-window-detected]]
if.app-id = 'com.neovide.neovide'
run = ['move-node-to-workspace Development']

[[on-window-detected]]
if.app-id = 'com.jetbrains.goland'
run = ['move-node-to-workspace Development']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 1st-Workspace']

# Browser
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace Browser']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace Browser']

[[on-window-detected]]
if.app-id = 'org.chromium.Chromium'
run = ['move-node-to-workspace Browser']

# Communication
[[on-window-detected]]
if.app-id = 'im.riot.app'
run = ['move-node-to-workspace Communication']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace Communication']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace Communication']

[[on-window-detected]]
if.app-id = 'ch.protonmail.desktop'
run = ['move-node-to-workspace Communication']

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace Communication']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace Communication']

# 1st-Workspace — notes and freeform canvas
[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = ['move-node-to-workspace 1st-Workspace']

[[on-window-detected]]
if.app-id = 'com.apple.freeform'
run = ['move-node-to-workspace 1st-Workspace']

# 5th-Workspace — floating utilities
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['move-node-to-workspace 5th-Workspace', 'layout floating']

# Audio-Video
[[on-window-detected]]
if.app-id = 'tv.plex.desktop'
run = ['move-node-to-workspace Audio-Video']

[[on-window-detected]]
if.app-id = 'tv.plex.plexamp'
run = ['move-node-to-workspace Audio-Video']

[[on-window-detected]]
if.app-id = 'org.videolan.vlc'
run = ['move-node-to-workspace Audio-Video']

[[on-window-detected]]
if.app-id = 'sh.cider.Cider'
run = ['move-node-to-workspace Audio-Video']

[[on-window-detected]]
if.app-id = 'me.proton.pass.electron'
run = ['move-node-to-workspace 5th-Workspace', 'layout floating']

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
b = 'balance-sizes'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = [
  'layout floating tiling',
  'mode main',
]
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
