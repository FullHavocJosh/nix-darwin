# TUIOS Configuration File
# This file allows you to customize appearance and keybindings
#
# Configuration location: /Users/havoc/.config/tuios/config.toml
# Documentation: https://github.com/Gaurav-Gosain/tuios
# For keybindings documentation, run: tuios keybinds list
#
# tuios watches this file. A save takes effect at once, with no restart.
# tuios does not apply a file that has an error. It keeps the settings that
# are in use and shows the error on screen.

# ============================================================================
# APPEARANCE SETTINGS
# ============================================================================
# Many of these can be changed live from the in-app settings page
# (open it with the leader key followed by ',').
#
# border_style: rounded, normal, thick, double, hidden, block, ascii,
#               outer-half-block, inner-half-block
# dockbar_position: bottom, top, hidden
# window_title_position: bottom, top, hidden
# window_button_style: pill, dots (macOS traffic lights)
# window_button_position: right, left. Independent of the style; dots and
#               left is the shipped pair, the macOS arrangement
# theme: color theme name (e.g. dracula, nord); empty for terminal colors
# click_to_type: single (a click on a pane starts typing in it), double
#               (two clicks do), off (a click only focuses)
# auto_enter_terminal_on_focus: off (Tab keeps cycling windows),
#               targeted (numbered select and arrows start typing),
#               all (every covered focus command, including Tab)
# [appearance.scrollbar]: style = thin, track; thumb/track = a one-cell glyph
#               (track also takes "none"); tint = border, muted, #RRGGBB
# background: off (your terminal shows through), theme (the theme's
#               background), or #RRGGBB, for every surface at once
# pane_background, desktop_background, window_chrome_background,
#               dock_background, [appearance.sidebar] background: the same
#               values for one surface; empty follows background, and a
#               colour a program or the chrome chose always wins
# ============================================================================

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Set an action to [] to unbind it and hand the key back to the shell.
# An empty list and a missing line are not the same thing. A line this file
# does not have gets its default back the next time tuios starts; an action
# set to [] stays empty.
[keybindings]
leader_key = "ctrl+t"

# You do not have to edit this by hand. In tuios, open the keybind manager
# (leader then k, or the command palette) and press ctrl+d on a binding to
# remove it, or ctrl+x to take its key off every action. From a shell:
#
#   tuios keybinds unbind close_window w   # one key off one action
#   tuios keybinds free alt+left           # off every action
#
# `tuios keybinds doctor` says which binding in each scope is live, what
# clashes with what, and which keys never reach the program in the pane.
#
# [keybindings.global] acts in window mode and terminal mode alike. It binds
# ctrl+p to the command palette and alt+space to the launcher, which costs
# you fish's history-back and readline's set-mark. To move or drop either:
#
#   [keybindings.global]
#   command_palette = ["ctrl+shift+p"]
#   launcher = []
#
# [keybindings.terminal_mode] binds alt+arrows to move focus between panes.
# In readline, fish and zsh, alt+left and alt+right move the cursor a word
# at a time. If you want those back:
#
#   [keybindings.terminal_mode]
#   terminal_focus_left = []
#   terminal_focus_right = []
#
# alt+up and alt+down are unclaimed by the common shells, so they are the
# safer pair to keep.
#
# shift+pgup and shift+pgdown scroll one page. middle pastes from the host
# clipboard. Write ctrl+middle to add a modifier.
#
# hold_window_mode binds a key that puts tuios in window-management mode for
# as long as it is physically held, and hands the previous mode back when it
# is let go:
#
#   [keybindings.mode_control]
#   hold_window_mode = ["leftalt"]
#
# It needs a terminal that speaks the Kitty keyboard protocol (Ghostty, kitty,
# WezTerm, foot, Alacritty; not Terminal.app), because nothing else reports
# that a key was released. Naming a modifier key (leftalt, rightalt, leftctrl,
# leftsuper) asks the terminal for one more thing on top: every keystroke in
# the session then arrives as an escape code. Any ordinary key (f13 to f63,
# scrolllock, a spare letter) avoids that. Unbound by default.
# ============================================================================

# The herdr keys (.config/herdr/config.toml), on ctrl and ctrl+shift: aerospace owns alt, so tuios's default opt+
# keys (opt+1..9 workspaces, alt+arrows focus, opt+tab windows) never arrive. Global keys act in window and terminal
# mode and do not reach the pane. ctrl+h/l cycle windows and ctrl+j/k cycle agents (agent_cycle.py), with ctrl+t o and
# ctrl+t O still jumping to the agent that needs you and the newest finished turn. The pane no longer gets ctrl+h
# (in some terminals also Backspace) or ctrl+l (zsh clear-screen, LazyVim window moves).
[keybindings.global]
# herdr switch_tab: workspaces by number.
switch_workspace_1 = ["ctrl+1"]
switch_workspace_2 = ["ctrl+2"]
switch_workspace_3 = ["ctrl+3"]
switch_workspace_4 = ["ctrl+4"]
switch_workspace_5 = ["ctrl+5"]
switch_workspace_6 = ["ctrl+6"]
switch_workspace_7 = ["ctrl+7"]
switch_workspace_8 = ["ctrl+8"]
switch_workspace_9 = ["ctrl+9"]
# herdr next/previous_workspace: a herdr workspace per repo is a tuios session per repo (dev-<repo>).
next_session = ["ctrl+shift+j"]
prev_session = ["ctrl+shift+k"]
prefix_toggle_sidebar = ["ctrl+shift+h"]
# herdr workspace_picker: agents, sessions, workspaces and panes in one picker.
goto_picker = ["ctrl+shift+p"]
# ctrl+p back to zsh (up-line-or-beginning-search) and Neotree; the palette stays on ctrl+t P.
command_palette = []
# Move the pane to workspace N and follow it (tuios's default is opt+shift+N, which aerospace takes). ctrl+t space
# shift+N moves it without following.
move_and_follow_1 = ["ctrl+shift+1"]
move_and_follow_2 = ["ctrl+shift+2"]
move_and_follow_3 = ["ctrl+shift+3"]
move_and_follow_4 = ["ctrl+shift+4"]
move_and_follow_5 = ["ctrl+shift+5"]
move_and_follow_6 = ["ctrl+shift+6"]
move_and_follow_7 = ["ctrl+shift+7"]
move_and_follow_8 = ["ctrl+shift+8"]
move_and_follow_9 = ["ctrl+shift+9"]
# The launcher stays on ctrl+t a; alt+space is aerospace's side of the keyboard.
launcher = []

# Like herdr's cycle_pane, ctrl+h/l cycle windows in both modes. The pane no longer gets ctrl+h (in some terminals
# also Backspace) or ctrl+l (zsh clear-screen, LazyVim window moves).
prev_window = ["ctrl+h"]
next_window = ["ctrl+l"]

[keybindings.prefix_mode]
# herdr split_vertical was prefix+/; ctrl+shift+p covers choose_tree's pane search.
prefix_split_vertical = ["|", "\\", "/"]
choose_tree = []
# ctrl+t g is lazygit below, the herdr gitview key. The scratch terminal takes s from the scrollback browser:
# ctrl+t [ (copy mode) and ctrl+t E (scrollback in nvim) read pane output, atuin covers typed commands, and the
# browser stays in the command palette (ctrl+t P).
toggle_scratch = ["s"]
prefix_scrollback = []
# n new window, w close window, W close session; tab/shift+tab alone cycle windows (n/p dropped, c and x freed).
prefix_new_window = ["n"]
prefix_close_window = ["w"]
prefix_close_session = ["W"]
prefix_next_window = ["tab"]
prefix_prev_window = ["shift+tab"]
# The workspace prefix leaves w for space (herdr's "spaces"): ctrl+t space 1..9 switch, shift+1..9 move the window,
# r rename. Tiling stays on ctrl+t t t; the workspace switcher is in ctrl+shift+p / ctrl+t G and the palette.
prefix_workspace = ["space"]
prefix_toggle_tiling = []
prefix_workspace_switcher = []
# q leaves tuios and everything keeps running (dev reattaches); d stays. The quit that kills the session has no key.
prefix_detach = ["q", "d"]
prefix_quit = []
# hjkl beside the arrows, as in window mode and copy mode. j and k move to J (newest message) and K (keybind manager).
terminal_focus_left = ["left", "h"]
terminal_focus_down = ["down", "j"]
terminal_focus_up = ["up", "k"]
terminal_focus_right = ["right", "l"]
prefix_jump_notif = ["J"]
prefix_keybinds = ["K"]
# ctrl+t ctrl+t sends ctrl+t to the pane: Claude Code's task checklist, nvim's tag jump back.
send_prefix = ["ctrl+t"]

# tuios is ctrl only: alt belongs to aerospace (ALT+ aerospace, CTRL+ tuios, CMD+ macOS, Space+ nvim). Every opt/alt
# default moves to a ctrl key or goes where a ctrl key or the prefix already does the job.
[keybindings.terminal_mode]
# Without the prefix: ctrl+tab / ctrl+shift+tab cycle windows (Ghostty's tab keys are unbound), ctrl+shift+arrows
# move focus. ctrl+t esc leaves terminal mode.
terminal_next_window = ["ctrl+tab"]
terminal_prev_window = ["ctrl+shift+tab"]
terminal_focus_left = ["ctrl+shift+left"]
terminal_focus_down = ["ctrl+shift+down"]
terminal_focus_up = ["ctrl+shift+up"]
terminal_focus_right = ["ctrl+shift+right"]
terminal_exit_mode = []

[keybindings.window_management]
# ctrl+shift+j/k switch sessions.
next_session = []
prev_session = []

# Window mode creates and destroys nothing on one key: ctrl+t w closes a window, ctrl+t n opens one, ctrl+t W closes
# the session, the sidebar's n or + makes a session.
close_window = []
new_window = []
new_session = []

[keybindings.mode_control]
# A q in window mode quit tuios on one key; ctrl+t q detaches and everything keeps running.
quit = []

[keybindings.workspaces]
# ctrl+1..9 switch, ctrl+shift+1..9 move and follow, ctrl+t space shift+1..9 move.
switch_workspace_1 = []
switch_workspace_2 = []
switch_workspace_3 = []
switch_workspace_4 = []
switch_workspace_5 = []
switch_workspace_6 = []
switch_workspace_7 = []
switch_workspace_8 = []
switch_workspace_9 = []
move_and_follow_1 = []
move_and_follow_2 = []
move_and_follow_3 = []
move_and_follow_4 = []
move_and_follow_5 = []
move_and_follow_6 = []
move_and_follow_7 = []
move_and_follow_8 = []
move_and_follow_9 = []
send_to_workspace_1 = []
send_to_workspace_2 = []
send_to_workspace_3 = []
send_to_workspace_4 = []
send_to_workspace_5 = []
send_to_workspace_6 = []
send_to_workspace_7 = []
send_to_workspace_8 = []
send_to_workspace_9 = []

[keybindings.layout]
# Preselect (opt+hjkl) has no ctrl key left that nvim and the shell do not use; split with ctrl+t - or ctrl+t |.
preselect_left = []
preselect_down = []
preselect_up = []
preselect_right = []

# Splits only behind the prefix: ctrl+t - and ctrl+t |.
split_horizontal = []
split_vertical = []

[[keybindings.command]]
key = "prefix+g"
type = "shell"
command = "tuios popup --width 90% --height 90% --cwd \"$TUIOS_ACTIVE_PANE_CWD\" -- lazygit"
description = "lazygit in a popup"

# Like herdr's next/previous_agent. A command key without prefix+ works in window and terminal mode. The pane no
# longer gets ctrl+j (zsh accept-line, Claude Code newline) or ctrl+k (zsh kill-line).
[[keybindings.command]]
key = "ctrl+j"
type = "shell"
command = 'python3 "$HOME/.config/tuios/agent_cycle.py" next'
description = "Next agent, every session"

[[keybindings.command]]
key = "ctrl+k"
type = "shell"
command = 'python3 "$HOME/.config/tuios/agent_cycle.py" prev'
description = "Previous agent, every session"

# ============================================================================
# DOCK COMPONENTS
# ============================================================================
# The dock is three ordered lists of component names. Leave [dock] out
# entirely and the bar draws what it always drew; write the lists to
# reorder it, and omit a name to drop that segment.
#
#   [dock]
#   left   = ["mode", "workspaces", "trail", "tape"]
#   center = ["windows"]
#   right  = ["notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]
#
# A cell of your own is a command whose first line of stdout is the text:
#
#   [dock.custom.branch]
#   command = "git branch --show-current"
#   refresh = "event:after-focus-change"   # or once, push, or "30s"
#
# and then "custom/branch" in one of the lists above. A component that
# fails is hidden rather than left showing a stale value;
# `tuios list-dock-components` says which and why.
# ============================================================================

[startup]
tiled = true
daemon = true

[agents]
# on: aidev_test's Claude pane mails the builder, asks the Lumo pane (ask-agent) and asks you (ask-human).
enabled = true
# off: tuios panes get no HERDR_* variables, so herdr-era code (gpr's _herdr_sync_dev_panes, the herdr Claude and
# OpenCode hooks, herdr's pi extension) treats a tuios pane as a plain terminal instead of driving it through
# tuios's herdr emulation. State reporting comes from tuios's own hooks, installed per pane by aidev_test.py.
herdr_protocol = "off"

[agents.permissions]
# strict: a pane started without --grants holds `grants` (your shells). aidev starts every model pane with its own
# --grants: the Claude plan pane read,write,fan,files,respond, so it can answer the builder's permission prompts after
# you approve them in its chat; the builder read,write (mail back to Claude, no typing into it); Lumo read. Your shells
# hold respond only so they can pass it to the plan pane.
mode = "strict"
grants = ["read", "write", "files", "admin", "respond"]

[appearance]
scrollback_lines = 100000
zoom_size = 95
window_title_align = "left"
window_button_style = "pill"
show_cpu = true
show_ram = true
clock_format = "3:004PM"
show_clock = true
dock_prefix_indicator = "pill"

# The focused border is red in window mode, where single keys act on panes, and blue in terminal mode, where keys go
# to the program.
border_focused_color_window = "#f38ba8"
border_focused_color_terminal = "#89b4fa"

[spotlight]
enabled = false

# One rail, on the left. No [appearance.sidebar.left/right] edge tables: the edge opposite position stays hidden
# unless its table sets enabled = true, and ctrl+t H toggles it for a moment.
[appearance.sidebar]
enabled = true
position = "left"
width = 39
# Files as a tree that opens folders in place, capped at a fifth of the rail; agents get the most room.
sections = "sessions:30,terminals:15,files:20,agents:35"
files_style = "tree"
header_case = "uppercase"
# No window count on session rows: every dev session has the same few windows.
show_counts = false
row_style = "underline"
header_style = "pill"
show_numbers = false
marquee = true
tooltips = true
subagent_collapse = "collapsed"

# The two Macs link to each other (dev, peerdev); each Mac also lists itself, which tuios only holds as an idle link.
[hosts.mini]
addr = "havoc@macminim1.rollet.family"

[hosts.macbook]
addr = "havoc@macbookm2pro.rollet.family"

[appearance.sidebar.left]
enabled = true

# The daemon runs this with nobody attached to the pane, so a pane that needs an answer still reaches you when no
# client is watching. Changing hooks needs `tuios restart-server` to take effect.
[hooks]
after-agent-state = ["sh ~/.config/tuios/hooks/agent-attention.sh"]

# A pane you already have in front of you does not also raise a notification; only panes elsewhere do.
[notifications.agent]
suppress_focused = true

# A workspace whose tab is out of view turns this colour while one of its panes waits, so the wait is visible without
# focusing it first.
[dock.tabs]
attention_fg = "#f38ba8"
