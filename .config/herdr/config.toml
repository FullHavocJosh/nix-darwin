[keys]
prefix = "ctrl+t"

# Mirrors ~/.config/tmux/tmux.conf's custom bindings where a clean equivalent exists.
# split_vertical/split_horizontal direction is a best guess (couldn't verify without
# a real attached terminal -- CLI send-keys bypasses herdr's own prefix dispatch and
# hits the pane's shell directly, e.g. ctrl+t triggered zsh/fzf's own binding instead
# of herdr's prefix). Swap the two lines below if the split direction comes out
# backwards from tmux's `/` (side-by-side) and `-` (stacked).
split_vertical = "prefix+/"
split_horizontal = "prefix+minus"

# tmux: `bind w kill-pane`. Conflicts with herdr's default workspace_picker="prefix+w",
# so workspace_picker moves to prefix+p (freed up since previous_tab moved off prefix+p).
close_pane = "prefix+w"
workspace_picker = "prefix+p"

# zoom already matches tmux's `bind z resize-pane -Z` by default (prefix+z) -- no change needed.

# Custom scheme, not a tmux mirror: unshifted h/j/k/l cycle tabs and agents (h/l for
# tabs, j/k for agents -- swapped from herdr's default, which puts pane-focus movement
# on unshifted h/j/k/l), u/i cycle workspaces ("spaces"). Direction convention throughout:
# left/up key = previous, right/down key = next.
previous_tab = "prefix+h"
next_tab = "prefix+l"
previous_agent = "prefix+k"
next_agent = "prefix+j"
previous_workspace = "prefix+u"
next_workspace = "prefix+i"

# Pane-focus movement moved off herdr's default unshifted h/j/k/l (now used for
# tab/agent cycling above) onto shift+h/j/k/l instead.
focus_pane_left = "prefix+shift+h"
focus_pane_down = "prefix+shift+j"
focus_pane_up = "prefix+shift+k"
focus_pane_right = "prefix+shift+l"

# Jump straight to agent N. herdr's own default-config comments suggest
# "prefix+alt+1..9" for this exact binding, leaving switch_tab on its default
# prefix+1..9 (tab-by-number) untouched. No tmux equivalent (no agent concept there).
focus_agent = "prefix+alt+1..9"

# Not portable from tmux.conf:
# - C-h/j/k/l vim-tmux-navigator passthrough (detects if the focused pane is running
#   vim and forwards the key instead of switching panes). herdr has no equivalent
#   conditional detection, and binding ctrl+h/j/k/l directly (unprefixed) would break
#   backspace/other shell defaults globally.
# - v/y copy-mode selection bindings. No exposed config equivalent; herdr's
#   scrollback/copy appears to rely on native mouse selection instead.

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[theme]
name = "terminal"
auto_switch = false
