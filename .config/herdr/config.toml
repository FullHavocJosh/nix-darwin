onboarding = false
[keys]
prefix = "ctrl+t"

# split_vertical/split_horizontal direction is a best guess (couldn't verify without
# a real attached terminal -- CLI send-keys bypasses herdr's own prefix dispatch and
# hits the pane's shell directly, e.g. ctrl+t triggered zsh/fzf's own binding instead
# of herdr's prefix). Swap the two lines below if the split direction comes out
# backwards (`/` = side-by-side, `-` = stacked).
split_vertical = "prefix+/"
split_horizontal = "prefix+minus"

# Conflicts with herdr's default workspace_picker="prefix+w".
close_pane = "prefix+w"

# Everything below lives entirely on ctrl+ and ctrl+shift+ -- deliberately off the
# alt+ modifier aerospace.toml owns globally (mode.main.binding fires at the OS
# level before any app, herdr included, ever sees the keystroke). The old
# prefix+alt+1..9 focus_agent binding was the one holdout that overlapped
# aerospace's alt+1..5 workspace-switch hotkeys and has been dropped in favor of
# switch_tab below, now that aidev lives in its own tab (see .zshrc_aliases).
#
# j/k cycle agents down/up. h/l cycle panes in the dev tab's traversal order
# (nvim -> tuicr -> zsh -> nvim...) -- with nvim as a full-height left pane and
# tuicr/zsh stacked to its right, that order visually runs clockwise, so
# h = counterclockwise (previous), l = clockwise (next). This shadows the
# shell's own Ctrl+L (clear-screen) and Ctrl+J (newline) readline bindings while
# a herdr pane has focus -- accepted tradeoff for a single-key scheme.
next_agent = "ctrl+j"
previous_agent = "ctrl+k"
cycle_pane_next = "ctrl+l"
cycle_pane_previous = "ctrl+h"

# Direct tab-by-number, no prefix needed.
switch_tab = "ctrl+1..9"

# ctrl+shift+j/k switch spaces (workspaces) down/up, mirroring the ctrl+j/k
# agent down/up convention above. ctrl+shift+h shows/hides the sidebar (spaces
# + agent list) instead of focus_pane_left, now that raw ctrl+h/l above already
# cover pane traversal.
next_workspace = "ctrl+shift+j"
previous_workspace = "ctrl+shift+k"
toggle_sidebar = "ctrl+shift+h"
workspace_picker = "ctrl+shift+p"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
status_indicators = "dots"
[theme]
name = "terminal"
auto_switch = false

[ui.sound]
enabled = true

[advanced]
# Matches ghostty's scrollback-limit (.config/ghostty/config).
scrollback_limit_bytes = 100000000
