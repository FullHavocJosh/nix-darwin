set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g base-index 1
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

if-shell '[ "$(uname)" = "Darwin" ]' \
  'set-option -g default-command "reattach-to-user-namespace -l zsh"; set-option -g default-shell "/bin/zsh"' \
  'set-option -g default-shell "/bin/zsh"'

set -g mouse on
bind -T copy-mode-vi WheelUpPane send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-paste

set -g prefix C-t
unbind C-b
bind-key C-t send-prefix

unbind %
bind / split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind R source-file ~/.config/tmux/tmux.conf

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind z resize-pane -Z
bind * setw synchronize-panes
bind S choose-session
bind K send-keys "clear"\; send-keys "Enter"
bind w kill-pane

bind -r + resize-pane -U 5
bind -r _ resize-pane -D 5
bind -r = select-layout even-horizontal

bind H previous-window
bind L next-window

set -sg escape-time 0
set-option -g detach-on-destroy on

bind i run-shell '~/.config/tmux/plugins/tpm/scripts/install_plugins.sh'
bind u run-shell '~/.config/tmux/plugins/tpm/scripts/update_plugins.sh'
bind U run-shell '~/.config/tmux/plugins/tpm/scripts/clean_plugins.sh'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @sessionx-bind 'o'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '~/nix-darwin'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "none"

set -g @catppuccin_battery_color "#{@thm_peach}"

set -g status-justify left
set -g status-left-length 360
set -g status-left "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

set -g status-right-length 120
set -g status-right "#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}"

# Hide window list
set -g window-status-format ""
set -g window-status-current-format ""

set -g @catppuccin_battery_icon "#(~/.config/tmux/plugins/tmux-battery/scripts/battery_icon.sh) "
set -g @catppuccin_battery_text " #(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh)"
set -g @catppuccin_battery_color "#{@thm_peach}"
set -g @catppuccin_status_battery_icon_bg "#{@thm_peach}"

set -g @catppuccin_date_time_text " %I:%M %p %m-%d-%Y"
set -g @catppuccin_date_time_icon "󰃰 "

set -g @catppuccin_window_number "󰖯"
set -g @catppuccin_window_current_number "󰖯"

set -g @catppuccin_window_number_color "blue"
set -g @catppuccin_window_current_number_color "blue"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"

set -g @catppuccin_host_icon "󰌢 "
set -g @catppuccin_host_text " #h"

set -g @catppuccin_directory_text " #{pane_current_path}"

set -g @catppuccin_session_color "green"
set -g @catppuccin_session_icon "󰙀 "

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

run '~/.config/tmux/plugins/tpm/tpm'
