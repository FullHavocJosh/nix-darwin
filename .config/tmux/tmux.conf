set -g default-terminal "tmux-256color"
set -g terminal-overrides '*,xterm-256color:Tc'

# Enhanced settings from omerxx's config
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi            # vi mode keys

# Set default command based on OS.
if-shell '[ "$(uname)" = "Darwin" ]' \
  'set-option -g default-command "reattach-to-user-namespace -l /run/current-system/sw/bin/zsh"' \
  'set-option -g default-command "exec /run/current-system/sw/bin/zsh"'

#Enable Mouse Scrolling
set -g mouse on  # Modern tmux scrolling
bind -T copy-mode-vi WheelUpPane send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-paste

# Change prefix to from Alt + a to Ctrl + t
set -g prefix C-t
unbind C-b
bind-key C-t send-prefix

unbind %
bind / split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind R source-file ~/.config/tmux/tmux.conf  # Alternative binding

# vim-tmux-navigator bindings - Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Additional keybindings from omerxx's config (non-conflicting)
bind z resize-pane -Z                    # Toggle pane zoom
bind * setw synchronize-panes            # Toggle pane synchronization
bind S choose-session                    # Session chooser
bind K send-keys "clear"\; send-keys "Enter"  # Clear screen
bind w kill-pane                         # Close current pane

# Pane resizing with repeatable keys
bind -r + resize-pane -U 5
bind -r _ resize-pane -D 5
bind -r = select-layout even-horizontal

# Window navigation (alternative to defaults)
bind H previous-window
bind L next-window

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0             # zero-out escape time delay (omerxx uses 0)

# Exit tmux when last pane closes instead of switching sessions
set-option -g detach-on-destroy on

# Custom tpm key bindings
bind i run-shell '~/.config/tmux/plugins/tpm/scripts/install_plugins.sh'
bind u run-shell '~/.config/tmux/plugins/tpm/scripts/update_plugins.sh'
bind U run-shell '~/.config/tmux/plugins/tpm/scripts/clean_plugins.sh'

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# Additional plugins from omerxx's config - load sensible first
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'        # Better copy/paste
set -g @plugin 'fcsonline/tmux-thumbs'        # Quick text selection
set -g @plugin 'sainnhe/tmux-fzf'             # FZF integration
set -g @plugin 'wfxr/tmux-fzf-url'            # URL fuzzy finder
set -g @plugin 'omerxx/tmux-sessionx'         # Enhanced session management
set -g @plugin 'omerxx/tmux-floax'            # Floating windows
set -g @plugin 'tmux-plugins/tmux-battery'    # Battery status - MUST load before catppuccin

# Plugin configurations from omerxx's config
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'  # Disable auto-restore to prevent delays
set -g @resurrect-strategy-nvim 'session'

# FZF URL plugin configuration
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# SessionX configuration
set -g @sessionx-bind 'o'                     # Use 'o' to open sessionx
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '~/nix-darwin'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# Floax configuration - let catppuccin handle colors
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'p'                        # Use 'p' for floating window
set -g @floax-change-path 'true'

# Catppuccin theme plugin - load LAST to override other plugin styles
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha' # or frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"

# Set battery color BEFORE other catppuccin configurations
set -g @catppuccin_battery_color "#{@thm_yellow}"

# Custom status line layout
set -g status-justify left
set -g status-left-length 240
set -g status-right-length 60

# Set transparent background for status bar (empty space between plugins)
set -g @catppuccin_status_background "none"
set -g status-style "bg=default"

set -g status-left "#{E:@catppuccin_status_host}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# Use catppuccin date_time and battery modules for consistent rounded styling
set -g status-right "#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}"

# Override catppuccin battery module to use direct script calls instead of variables
set -g @catppuccin_battery_icon "#(~/.config/tmux/plugins/tmux-battery/scripts/battery_icon.sh) "
set -g @catppuccin_battery_text " #(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh)"
set -g @catppuccin_battery_color "#{@thm_yellow}"

# Force override the battery icon background color to yellow
set -g @catppuccin_status_battery_icon_bg "#{@thm_yellow}"

# Customize date_time format to 12-hour with AM/PM and fix icon spacing
set -g @catppuccin_date_time_text " %I:%M %p %m-%d-%Y"
set -g @catppuccin_date_time_icon "󰃰 "

# Customize catppuccin window number to use tmux icon instead of window index
set -g @catppuccin_window_number "󰙀"
set -g @catppuccin_window_current_number "󰙀"

# Set window colors to match session colors (green)
set -g @catppuccin_window_number_color "green"
set -g @catppuccin_window_current_number_color "green"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"

# Customize host module icon to laptop icon and use short hostname
set -g @catppuccin_host_icon "󰌢 "
set -g @catppuccin_host_text " #h"

# Customize directory module to show full path instead of just basename
set -g @catppuccin_directory_text " #{pane_current_path}"

# Set session number background to default green
set -g @catppuccin_session_color "green"

# Set TPM path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

