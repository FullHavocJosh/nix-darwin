# Application bindings
# Personal customizations and overrides

# Terminal
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"

# Core applications
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus cider
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- proton-pass

# AI & Development web apps
bindd = SUPER SHIFT, A, AI Dev, exec, uwsm-app -- xdg-terminal-exec --app-id=org.omarchy.aidev -e zsh -ic aidev
bindd = SUPER SHIFT ALT, A, OpenRouter, exec, omarchy-launch-webapp "https://openrouter.ai/chat"

# Productivity web apps
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.proton.me"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"

# Additional custom bindings
# bindd = SUPER SHIFT, K, Krita, exec, uwsm-app -- flatpak run org.kde.krita
# bindd = SUPER SHIFT, V, VLC, exec, uwsm-app -- flatpak run org.videolan.VLC

# Disable PgUp and PgDn keys
bind = , Prior, exec, true  # Prior = PgUp
bind = , Next, exec, true   # Next = PgDn
