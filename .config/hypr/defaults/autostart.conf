# Autostart applications
# Optimized for Nobara KDE - uses default KDE applications where possible

# Idle management
exec-once = hypridle

# Notifications (using KDE's notification system)
# Note: KDE's plasma-workspace provides notifications via knotifications
# If you want a standalone daemon, uncomment: exec-once = mako

# Status bar
exec-once = waybar

# Input method (optional - only if you need non-Latin input)
# exec-once = fcitx5

# Wallpaper (using hyprpaper - lighter than swaybg)
exec-once = hyprpaper

# Polkit authentication agent (KDE provides its own)
exec-once = /usr/libexec/polkit-kde-authentication-agent-1

# Clipboard manager (using KDE's klipper which is already running)
# KDE's klipper handles clipboard history automatically
# No need for cliphist setup

# Portal for screen sharing (uses xdg-desktop-portal-hyprland)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
