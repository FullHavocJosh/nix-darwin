# Look and Feel Configuration with Catppuccin Mocha Theme
# https://wiki.hyprland.org/Configuring/Variables/

# Catppuccin Mocha Colors
$rosewater = rgb(f5e0dc)
$flamingo = rgb(f2cdcd)
$pink = rgb(f5c2e7)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$maroon = rgb(eba0ac)
$peach = rgb(fab387)
$yellow = rgb(f9e2af)
$green = rgb(a6e3a1)
$teal = rgb(94e2d5)
$sky = rgb(89dceb)
$sapphire = rgb(74c7ec)
$blue = rgb(89b4fa)
$lavender = rgb(b4befe)
$text = rgb(cdd6f4)
$subtext1 = rgb(bac2de)
$subtext0 = rgb(a6adc8)
$overlay2 = rgb(9399b2)
$overlay1 = rgb(7f849c)
$overlay0 = rgb(6c7086)
$surface2 = rgb(585b70)
$surface1 = rgb(45475a)
$surface0 = rgb(313244)
$base = rgb(1e1e2e)
$mantle = rgb(181825)
$crust = rgb(11111b)

# Border colors
$activeBorderColor = $mauve
$inactiveBorderColor = $surface0

# General settings
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# Decoration
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    active_opacity = 0.97
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = $crust
        color_inactive = $crust
    }

    # Blur
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }

    # Dim
    dim_inactive = true
    dim_strength = 0.05
}

# Group settings
# https://wiki.hypr.land/Configuring/Variables/#group
group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = $red
    col.border_locked_inactive = $maroon

    groupbar {
        font_size = 11
        font_family = CaskaydiaCove Nerd Font
        font_weight_active = 700
        font_weight_inactive = 400

        height = 18
        gaps_in = 5
        gaps_out = 10

        text_color = $text
        col.active = $surface1
        col.inactive = $surface0

        gradients = true
        render_titles = true
        scrolling = true
    }
}

# Animations
# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint, popin 87%
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 3.5, easeOutQuint, slide
}

# Dwindle layout
# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2  # Always split on the right
}

# Master layout
# https://wiki.hyprland.org/Configuring/Master-Layout/
master {
    new_status = master
    new_on_top = false
}

# Misc settings
# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(Alacritty|kitty|footclient)$
    new_window_takes_over_fullscreen = 1
    initial_workspace_tracking = 1
}

# Cursor
# https://wiki.hypr.land/Configuring/Variables/#cursor
cursor {
    no_hardware_cursors = false
    hide_on_key_press = true
    inactive_timeout = 5
}
