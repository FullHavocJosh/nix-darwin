# Monitor Configuration
# Configure your monitors here
# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors: hyprctl monitors

# Default: auto-detect with 1.6x scaling (good for 27-32" 4K monitors)
monitor = , preferred, auto, auto

# Example for retina-class 2x displays (13" 2.8K, 27" 5K, 32" 6K)
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# Example for straight 1x setup (1080p or 1440p monitors)
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for dual monitor setup:
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2
