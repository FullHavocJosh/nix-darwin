# Clipboard Keybindings
# Universal copy/paste using sendshortcut

# Copy/Paste/Cut
bind = SUPER, C, sendshortcut, CTRL, Insert,
bind = SUPER, V, sendshortcut, SHIFT, Insert,
bind = SUPER, X, sendshortcut, CTRL, X,

# Standard CTRL+C/V/X for terminals and apps that expect it
bind = CTRL, C, sendshortcut, CTRL, C,
bind = CTRL, V, sendshortcut, CTRL, V,
bind = CTRL, X, sendshortcut, CTRL, X,
