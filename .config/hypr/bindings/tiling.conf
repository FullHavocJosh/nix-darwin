# Tiling and Window Management Keybindings
# Migrated from Omarchy with standard Hyprland commands

# Close windows
bind = SUPER, W, killactive,
bind = CTRL ALT, DELETE, exec, hyprctl clients -j | jq -r '.[].address' | xargs -I {} hyprctl dispatch closewindow address:{}

# Control tiling
bind = SUPER, J, togglesplit,
bind = SUPER, P, pseudo,
bind = SUPER, T, togglefloating,
bind = SUPER, F, fullscreen, 0
bind = SUPER CTRL, F, fullscreenstate, 0 2
bind = SUPER ALT, F, fullscreen, 1
bind = SUPER, O, pin,
bind = SUPER SHIFT, O, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin

# Move focus with SUPER + arrow keys
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

# Move focus with SUPER + hjkl (vim-style)
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Switch workspaces with SUPER + [1-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move active window to workspace with SUPER + SHIFT + [1-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Move active window to workspace silently
bind = SUPER ALT, 1, movetoworkspacesilent, 1
bind = SUPER ALT, 2, movetoworkspacesilent, 2
bind = SUPER ALT, 3, movetoworkspacesilent, 3
bind = SUPER ALT, 4, movetoworkspacesilent, 4
bind = SUPER ALT, 5, movetoworkspacesilent, 5
bind = SUPER ALT, 6, movetoworkspacesilent, 6
bind = SUPER ALT, 7, movetoworkspacesilent, 7
bind = SUPER ALT, 8, movetoworkspacesilent, 8
bind = SUPER ALT, 9, movetoworkspacesilent, 9

# Scratchpad
bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER ALT, S, movetoworkspacesilent, special:scratchpad

# TAB between workspaces
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1
bind = SUPER CTRL, TAB, workspace, previous

# Swap windows with SUPER + SHIFT + arrow keys
bind = SUPER SHIFT, LEFT, swapwindow, l
bind = SUPER SHIFT, RIGHT, swapwindow, r
bind = SUPER SHIFT, UP, swapwindow, u
bind = SUPER SHIFT, DOWN, swapwindow, d

# Swap windows with SUPER + SHIFT + hjkl (vim-style)
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d

# Cycle through applications on active workspace
bind = ALT, TAB, cyclenext,
bind = ALT, TAB, bringactivetotop,
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, bringactivetotop,

# Resize active window
bind = SUPER, MINUS, resizeactive, -100 0
bind = SUPER, EQUAL, resizeactive, 100 0
bind = SUPER SHIFT, MINUS, resizeactive, 0 -100
bind = SUPER SHIFT, EQUAL, resizeactive, 0 100

# Resize mode (enter with SUPER+R, use arrow keys or hjkl, exit with ESC or ENTER)
bind = SUPER, R, submap, resize
submap = resize
binde = , RIGHT, resizeactive, 20 0
binde = , LEFT, resizeactive, -20 0
binde = , UP, resizeactive, 0 -20
binde = , DOWN, resizeactive, 0 20
binde = , L, resizeactive, 20 0
binde = , H, resizeactive, -20 0
binde = , K, resizeactive, 0 -20
binde = , J, resizeactive, 0 20
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset

# Scroll through workspaces with SUPER + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with SUPER + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Groups
bind = SUPER, G, togglegroup,
bind = SUPER ALT, G, moveoutofgroup,

# Join groups
bind = SUPER CTRL, LEFT, moveintogroup, l
bind = SUPER CTRL, RIGHT, moveintogroup, r
bind = SUPER CTRL, UP, moveintogroup, u
bind = SUPER CTRL, DOWN, moveintogroup, d
bind = SUPER CTRL, H, moveintogroup, l
bind = SUPER CTRL, L, moveintogroup, r
bind = SUPER CTRL, K, moveintogroup, u
bind = SUPER CTRL, J, moveintogroup, d

# Navigate grouped windows
bind = SUPER ALT, TAB, changegroupactive, f
bind = SUPER ALT SHIFT, TAB, changegroupactive, b
bind = SUPER ALT, mouse_down, changegroupactive, f
bind = SUPER ALT, mouse_up, changegroupactive, b
