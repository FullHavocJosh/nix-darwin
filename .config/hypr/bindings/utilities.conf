# Utility Keybindings
# Optimized for Nobara KDE - uses default KDE applications

# Application launcher (using KDE's KRunner)
bind = SUPER, SPACE, exec, krunner
bind = SUPER, D, exec, krunner

# System menus (using KDE's power management)
bind = SUPER, ESCAPE, exec, qdbus org.kde.ksmserver /KSMServer org.kde.KSMServerInterface.logout -1 -1 -1
bind = , XF86PowerOff, exec, qdbus org.kde.ksmserver /KSMServer org.kde.KSMServerInterface.logout -1 -1 -1

# Terminal (using KDE's Konsole)
bind = SUPER, RETURN, exec, konsole
bind = SUPER SHIFT, RETURN, exec, konsole --workdir "$(~/.config/hypr/scripts/get-terminal-cwd.sh)"

# Calculator (using KDE's KCalc)
bind = , XF86Calculator, exec, kcalc

# File manager (using KDE's Dolphin)
bind = SUPER, E, exec, dolphin

# Browser (Firefox is standard on Nobara)
bind = SUPER, B, exec, firefox

# Screenshots (using KDE's Spectacle)
bind = , PRINT, exec, spectacle -r
bind = SHIFT, PRINT, exec, spectacle -r -c
bind = CTRL, PRINT, exec, spectacle -f
bind = ALT, PRINT, exec, ~/.config/hypr/scripts/screen-record.sh

# Color picker (using KDE's KColorChooser)
bind = SUPER, PRINT, exec, kcolorchooser

# Clipboard manager (using KDE's Klipper)
bind = SUPER CTRL, V, exec, qdbus org.kde.klipper /klipper org.kde.klipper.klipper.showKlipperPopupMenu

# Aesthetics
bind = SUPER SHIFT, SPACE, exec, killall -SIGUSR1 waybar
bind = SUPER, BACKSPACE, exec, hyprctl setprop active opaque toggle
bind = SUPER SHIFT, BACKSPACE, exec, ~/.config/hypr/scripts/toggle-gaps.sh

# Notifications (using KDE's notification system)
bind = SUPER, COMMA, exec, qdbus org.freedesktop.Notifications /org/freedesktop/Notifications org.freedesktop.Notifications.CloseNotification 0
bind = SUPER SHIFT, COMMA, exec, qdbus org.kde.plasmashell /org/freedesktop/Notifications org.freedesktop.Notifications.CloseNotification 0
bind = SUPER CTRL, COMMA, exec, qdbus org.freedesktop.Notifications /org/freedesktop/Notifications org.freedesktop.DBus.Properties.Set org.freedesktop.Notifications DoNotDisturb true

# Idle toggle (hypridle)
bind = SUPER CTRL, I, exec, pkill -SIGUSR1 hypridle && notify-send -a "Hypridle" "$(pgrep hypridle > /dev/null && echo 'Idle enabled' || echo 'Idle disabled')"

# Nightlight toggle (using KDE's built-in night color)
bind = SUPER CTRL, N, exec, qdbus org.kde.KWin /ColorCorrect org.kde.kwin.ColorCorrect.nightColorAutoLocationUpdate

# Waybar-less information
bind = SUPER CTRL, T, exec, notify-send "$(date +'%A %H:%M — %d %B W%V %Y')"
bind = SUPER CTRL, B, exec, notify-send "Battery" "$(cat /sys/class/power_supply/BAT0/capacity)%"

# Lock screen
bind = SUPER, BACKSLASH, exec, hyprlock

# Quick system commands
bind = SUPER SHIFT, Q, exec, hyprctl dispatch exit
bind = SUPER SHIFT, R, exec, hyprctl reload

# Volume control (when not using media keys - for desktop keyboards)
bind = SUPER, BRACKETLEFT, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = SUPER, BRACKETRIGHT, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = SUPER, BACKSLASH, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
