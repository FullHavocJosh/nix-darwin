# Utility Keybindings
# Based on Omarchy's utilities.conf with Fedora/KDE tools

# Menus
bindd = SUPER, SPACE, Launch apps, exec, krunner
bindd = SUPER CTRL, E, Emoji picker, exec, krunner
bindd = SUPER, ESCAPE, System menu, exec, qdbus org.kde.ksmserver /KSMServer org.kde.KSMServerInterface.logout -1 -1 -1
bindld = , XF86PowerOff, Power menu, exec, qdbus org.kde.ksmserver /KSMServer org.kde.KSMServerInterface.logout -1 -1 -1
bindd = , XF86Calculator, Calculator, exec, kcalc

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, killall -SIGUSR1 waybar
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle workspace gaps, exec, ~/.config/hypr/scripts/toggle-gaps.sh

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, qdbus org.freedesktop.Notifications /org/freedesktop/Notifications org.freedesktop.Notifications.CloseNotification 0
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, qdbus org.kde.plasmashell /org/freedesktop/Notifications org.freedesktop.Notifications.CloseNotification 0
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, qdbus org.freedesktop.Notifications /org/freedesktop/Notifications org.freedesktop.DBus.Properties.Set org.freedesktop.Notifications DoNotDisturb true

# Toggle idling
bindd = SUPER CTRL, I, Toggle locking on idle, exec, pkill -SIGUSR1 hypridle && notify-send -a "Hypridle" "$(pgrep hypridle > /dev/null && echo 'Idle enabled' || echo 'Idle disabled')"

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, qdbus org.kde.KWin /ColorCorrect org.kde.kwin.ColorCorrect.nightColorAutoLocationUpdate

# Captures
bindd = , PRINT, Screenshot with editing, exec, spectacle -r
bindd = SHIFT, PRINT, Screenshot to clipboard, exec, spectacle -r -c
bindd = ALT, PRINT, Screenrecording, exec, ~/.config/hypr/scripts/screen-record.sh
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Waybar-less information
bindd = SUPER CTRL, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = SUPER CTRL, B, Show battery remaining, exec, notify-send "󰁹    Battery is at $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo 'N/A')%"
