# Media Keybindings
# Using native PipeWire/WirePlumber (default on Nobara KDE)

# Volume control (using wpctl - native Nobara/PipeWire tool)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control (using brightnessctl - standard on Nobara)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Precise 1% adjustments with Alt modifier
bindel = ALT, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = ALT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ALT, XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = ALT, XF86MonBrightnessDown, exec, brightnessctl set 1%-

# Media playback controls (requires playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Switch audio output (using custom script)
bindl = SUPER, XF86AudioMute, exec, ~/.config/hypr/scripts/audio-switch.sh
