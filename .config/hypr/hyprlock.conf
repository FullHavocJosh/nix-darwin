# Hyprlock Configuration
# Lock screen with Catppuccin Mocha theme

# Catppuccin Mocha Colors
$rosewater = rgb(f5e0dc)
$flamingo = rgb(f2cdcd)
$pink = rgb(f5c2e7)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$maroon = rgb(eba0ac)
$peach = rgb(fab387)
$yellow = rgb(f9e2af)
$green = rgb(a6e3a1)
$teal = rgb(94e2d5)
$sky = rgb(89dceb)
$sapphire = rgb(74c7ec)
$blue = rgb(89b4fa)
$lavender = rgb(b4befe)
$text = rgb(cdd6f4)
$subtext1 = rgb(bac2de)
$subtext0 = rgb(a6adc8)
$overlay2 = rgb(9399b2)
$overlay1 = rgb(7f849c)
$overlay0 = rgb(6c7086)
$surface2 = rgb(585b70)
$surface1 = rgb(45475a)
$surface0 = rgb(313244)
$base = rgb(1e1e2e)
$mantle = rgb(181825)
$crust = rgb(11111b)

background {
    monitor =
    path = ~/.wallpapers/wallhaven-l3mool.jpg
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true

    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = true
    placeholder_text = <span foreground="##$textAlpha">Enter Password...</span>
    hide_input = false
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow

    position = 0, -120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $text
    font_size = 22
    font_family = CaskaydiaCove Nerd Font

    position = 0, 150
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $text
    font_size = 95
    font_family = CaskaydiaCove Nerd Font Bold

    position = 0, 50
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =     $USER
    color = $text
    font_size = 14
    font_family = CaskaydiaCove Nerd Font

    position = 0, -160
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $green
    font_size = 12
    font_family = CaskaydiaCove Nerd Font

    position = -30, -10
    halign = right
    valign = top
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p | sed 's/up //')"
    color = $text
    font_size = 10
    font_family = CaskaydiaCove Nerd Font

    position = 30, -10
    halign = left
    valign = top
}
