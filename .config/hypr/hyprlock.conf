# Hyprlock Configuration
# Based on Omarchy's hyprlock style with Catppuccin theme

# Catppuccin Mocha Colors
$text = rgb(cdd6f4)
$surface0 = rgb(313244)
$mauve = rgb(cba6f7)
$yellow = rgb(f9e2af)
$red = rgb(f38ba8)
$base = rgb(1e1e2e)

background {
    monitor =
    color = $base
    path = ~/.wallpapers/wallhaven-l3mool.jpg
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $surface0
    outer_color = $mauve
    outline_thickness = 4

    font_family = CaskaydiaMono Nerd Font Propo
    font_color = $text

    placeholder_text = Enter Password 󰈷
    check_color = $yellow
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
