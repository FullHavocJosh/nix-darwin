# Custom Window Rules
# App-specific opacity, workspace, and behavior rules
# These supplement (not replace) omarchy's default window rules

# Terminal applications
windowrulev2 = opacity 0.95 0.85, class:(Alacritty)
windowrulev2 = opacity 0.95 0.85, class:(kitty)
windowrulev2 = opacity 0.95 0.85, class:(foot)
windowrulev2 = animation slide, class:(Alacritty|kitty|foot)

# Floating terminal instances
windowrulev2 = float, class:(Alacritty), title:^(floating)
windowrulev2 = size 1200 800, class:(Alacritty), title:^(floating)
windowrulev2 = center, class:(Alacritty), title:^(floating)

# Scratchpad terminal
windowrulev2 = workspace special:scratchpad, class:(Alacritty), title:^(scratchpad)
windowrulev2 = float, class:(Alacritty), title:^(scratchpad)
windowrulev2 = size 1400 900, class:(Alacritty), title:^(scratchpad)
windowrulev2 = center, class:(Alacritty), title:^(scratchpad)

# Browsers (opaque and workspace 2)
windowrulev2 = opacity 1.0 1.0, class:(firefox|Firefox)
windowrulev2 = opacity 1.0 1.0, class:(chromium|Chromium)
windowrulev2 = opacity 1.0 1.0, class:(brave|Brave-browser)
windowrulev2 = workspace 2 silent, class:(firefox|Firefox|chromium|Chromium|brave|Brave-browser)

# Development tools
windowrulev2 = workspace 3 silent, class:(code|Code|VSCodium)

# Communication apps
windowrulev2 = workspace 4 silent, class:(Slack|discord|Discord)

# Music apps
windowrulev2 = workspace 5 silent, class:(Spotify|spotify)

# File managers
windowrulev2 = float, class:(org.gnome.Nautilus)
windowrulev2 = size 1200 800, class:(org.gnome.Nautilus)
windowrulev2 = center, class:(org.gnome.Nautilus)

# Settings/Control panels
windowrulev2 = float, class:(pavucontrol|blueman-manager)
windowrulev2 = size 800 600, class:(pavucontrol|blueman-manager)
windowrulev2 = center, class:(pavucontrol|blueman-manager)

# Calculator
windowrulev2 = float, class:(gnome-calculator|org.gnome.Calculator)
windowrulev2 = size 400 600, class:(gnome-calculator|org.gnome.Calculator)

# Image viewers
windowrulev2 = float, class:(imv|feh|sxiv|nsxiv)
windowrulev2 = center, class:(imv|feh|sxiv|nsxiv)

# MPV
windowrulev2 = float, class:(mpv)
windowrulev2 = size 1280 720, class:(mpv)
windowrulev2 = center, class:(mpv)
windowrulev2 = opacity 1.0 1.0, class:(mpv)

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-660 100%-380, title:^(Picture-in-Picture)$
windowrulev2 = opacity 1.0 1.0, title:^(Picture-in-Picture)$

# Layer rules for blur effects
layerrule = blur, waybar
layerrule = blur, rofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
