# Hyprland Configuration
# Migrated from Omarchy with Fedora-compatible tools and Catppuccin Mocha theme

# Source default configurations
source = ~/.config/hypr/defaults/autostart.conf
source = ~/.config/hypr/defaults/envs.conf
source = ~/.config/hypr/defaults/input.conf
source = ~/.config/hypr/defaults/looknfeel.conf
source = ~/.config/hypr/defaults/windows.conf

# Source bindings
source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/clipboard.conf

# Source app-specific configurations
source = ~/.config/hypr/apps/terminals.conf
source = ~/.config/hypr/apps/browsers.conf

# Source local overrides (create this file for machine-specific settings)
source = ~/.config/hypr/locals/monitors.conf
source = ~/.config/hypr/locals/input.conf
source = ~/.config/hypr/locals/autostart.conf

# Add any other personal Hyprland configuration below
