# Control your input devices
# Customizations beyond omarchy defaults

input {
  # Faster keyboard repeat for productivity
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on
  numlock_by_default = true

  # Remap Caps Lock to Ctrl
  kb_options = ctrl:nocaps

  natural_scroll = true
  
  # Global sensitivity and acceleration
  sensitivity = -1.0
  accel_profile = flat

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace

# Per-device sensitivity settings
# Device names from: hyprctl devices

# Touchpad - keep at default sensitivity (sensitivity may not affect touchpads much)
device {
  name = cust0001:00-06cb:76af-touchpad
  sensitivity = 0.0
}

# External Keychron mouse - decreased sensitivity
device {
  name = keychron--keychron-link-
  sensitivity = -0.5
}
