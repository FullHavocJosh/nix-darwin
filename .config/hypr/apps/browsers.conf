# Browser application configurations
# Window rules for web browsers

# Firefox
windowrulev2 = opacity 1.0 1.0, class:(firefox)
windowrulev2 = opacity 1.0 1.0, class:(Firefox)
windowrulev2 = workspace 2, class:(firefox)
windowrulev2 = workspace 2, class:(Firefox)

# Chromium
windowrulev2 = opacity 1.0 1.0, class:(chromium)
windowrulev2 = opacity 1.0 1.0, class:(Chromium)
windowrulev2 = workspace 2, class:(chromium)
windowrulev2 = workspace 2, class:(Chromium)

# Brave
windowrulev2 = opacity 1.0 1.0, class:(brave)
windowrulev2 = opacity 1.0 1.0, class:(Brave-browser)
windowrulev2 = workspace 2, class:(brave)
windowrulev2 = workspace 2, class:(Brave-browser)

# Browser picture-in-picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture)$
windowrulev2 = opacity 1.0 1.0, title:^(Picture-in-Picture)$
