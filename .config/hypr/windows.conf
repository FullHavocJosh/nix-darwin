# Custom Window Rules
# App-specific opacity, workspace, and behavior rules
# These supplement (not replace) omarchy's default window rules

# Fix for Alacritty as default terminal - match Omarchy floating windows by title
windowrule = tag +floating-window, match:class Alacritty, match:title Omarchy

# Override Omarchy floating window size - 10% larger than default (default: 875x600, new: 962x660)
windowrule = size 1000 700, match:tag floating-window

# Override Omarchy floating window size for better logo rendering (Alacritty specific)
windowrulev2 = minsize 1000 700, match:class Alacritty, match:title Omarchy
windowrulev2 = maxsize 1000 700, match:class Alacritty, match:title Omarchy
