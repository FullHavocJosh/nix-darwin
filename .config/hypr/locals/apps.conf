# Application bindings
# Based on Omarchy's application launcher concept with Fedora/KDE tools

# Terminal
bindd = SUPER, RETURN, Terminal, exec, konsole --workdir="$(~/.config/hypr/scripts/get-terminal-cwd.sh)"

# File manager
bindd = SUPER SHIFT, F, File manager, exec, dolphin

# Browser
bindd = SUPER SHIFT, B, Browser, exec, firefox

# Editor
bindd = SUPER SHIFT, N, Editor, exec, code

# Activity monitor
bindd = SUPER SHIFT, T, Activity, exec, konsole -e btop

# System monitor (alternative)
bindd = SUPER SHIFT ALT, T, System monitor, exec, ksysguard

# Web apps (Omarchy style)
bindd = SUPER SHIFT, E, Email, exec, firefox --new-window https://mail.google.com
bindd = SUPER SHIFT, C, Calendar, exec, firefox --new-window https://calendar.google.com
bindd = SUPER SHIFT, Y, YouTube, exec, firefox --new-window https://youtube.com/

# Quick access apps
bindd = SUPER SHIFT, SLASH, Passwords, exec, firefox --new-window https://vault.bitwarden.com
