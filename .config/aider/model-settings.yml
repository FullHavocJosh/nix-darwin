# Model aliases for gpc/gpa's local-model calls (see _run_aider_local in
# .zshrc_functions_ai). Both point at whatever GGUF llama-server currently
# has loaded via the generic "local-coder" alias -- the split here is by
# use case (short commit message vs. thorough review), not by model.
# extra_params.chat_template_kwargs.enable_thinking=false stops thinking-
# capable models (GLM, Qwen3) from prepending a <think> block to every
# answer regardless of --reasoning-format.
- name: openai/local-coder-commit
  edit_format: ask
  extra_params:
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 512

- name: openai/local-coder-review
  edit_format: ask
  extra_params:
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 4096

# aistack's tier-0 supervisor (see aistack_func in .zshrc_functions_ai):
# local-coder-plan produces the directive handed to tier 1, local-coder-judge
# gives a one-word progressing/stuck/done/regressing verdict after each tier-1
# iteration. Both are read-only (edit_format: ask) -- tier 0 only plans and
# monitors, it never edits.
- name: openai/local-coder-plan
  edit_format: ask
  extra_params:
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 1024

- name: openai/local-coder-judge
  edit_format: ask
  extra_params:
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 256
