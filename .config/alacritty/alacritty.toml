general.import = ["~/.config/alacritty/catppuccin-mocha.toml"]

general.live_config_reload = true

[terminal.shell]
program = "/bin/zsh"

[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = { shape = "Block", blinking = "Off" }

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[window]
decorations = "None"
startup_mode = "Maximized"
dynamic_title = true
dynamic_padding = true
opacity = 1.0
blur = false

[window.padding]
x = 0
y = 0

[scrolling]
history = 100000
multiplier = 1
