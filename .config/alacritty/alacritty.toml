general.import = [
  "~/.config/alacritty/catppuccin-mocha.toml",
]

general.live_config_reload = true

[terminal.shell]
program = "/bin/zsh"

[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = {shape = "Block", blinking = "Off"}

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[window]
decorations = "Buttonless"
startup_mode = "Maximized"
dynamic_title = true
dynamic_padding = true
opacity = 0.8
blur = true

[window.padding]
x = 0
y = 0

[scrolling]
history = 100000
multiplier = 1
