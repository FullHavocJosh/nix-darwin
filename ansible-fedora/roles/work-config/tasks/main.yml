---
### Work-specific packages ###
- name: Install work-specific CLI tools
  dnf:
    name:
      - kubernetes-client
    state: present
  become: yes
  tags: ['work', 'cli']

- name: Install work-specific Flatpak applications
  flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - com.slack.Slack
    - com.microsoft.Edge
    - org.remmina.Remmina  # Remote desktop client
  tags: ['work', 'gui']

### Install k9s (Kubernetes dashboard) ###
- name: Download and install k9s
  get_url:
    url: "https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_amd64.tar.gz"
    dest: "/tmp/k9s.tar.gz"
  tags: ['work', 'k9s']

- name: Extract k9s
  unarchive:
    src: "/tmp/k9s.tar.gz"
    dest: "/tmp"
    remote_src: yes
  tags: ['work', 'k9s']

- name: Install k9s binary
  copy:
    src: "/tmp/k9s"
    dest: "/usr/local/bin/k9s"
    mode: '0755'
  become: yes
  tags: ['work', 'k9s']

- name: Clean up k9s files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/k9s.tar.gz"
    - "/tmp/k9s"
    - "/tmp/README.md"
    - "/tmp/LICENSE"
  tags: ['work', 'k9s']

### Work-specific configurations ###
- name: Create work configuration directory
  file:
    path: "{{ ansible_env.HOME }}/.config/work"
    state: directory
    mode: '0755'
  tags: ['work', 'config']