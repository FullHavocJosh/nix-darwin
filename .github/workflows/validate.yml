name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flake-eval:
    name: Evaluate darwin configurations
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Evaluate each configuration
        run: |
          for c in macos_laptop macos_desktop macos_work; do
            nix eval --raw ".#darwinConfigurations.${c}.system.drvPath"
            echo
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck --severity=error scripts/*.sh

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Scan only the commits this event adds; existing history is reviewed separately.
      - name: Scan new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          gitleaks detect --source . --redact --no-banner --verbose --log-opts="$range"
