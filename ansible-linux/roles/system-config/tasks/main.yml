---
### Shell Configuration ###
- name: Set Zsh as default shell for current user
  user:
    name: "{{ ansible_env.USER }}"
    shell: /usr/bin/zsh
  become: yes
  tags: ['system', 'shell']

### System Settings ###
- name: Enable RPM Fusion repositories
  dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: yes
  become: yes
  tags: ['system', 'repos']

- name: Update package cache
  dnf:
    update_cache: yes
  become: yes
  tags: ['system', 'update']

### Dark Theme Settings (GNOME) ###
- name: Set dark theme for GNOME (if running GNOME)
  dconf:
    key: "/org/gnome/desktop/interface/gtk-theme"
    value: "'Adwaita-dark'"
  when: ansible_env.XDG_CURRENT_DESKTOP is defined and 'GNOME' in ansible_env.XDG_CURRENT_DESKTOP
  tags: ['system', 'theme']

- name: Set dark theme preference
  dconf:
    key: "/org/gnome/desktop/interface/color-scheme"
    value: "'prefer-dark'"
  when: ansible_env.XDG_CURRENT_DESKTOP is defined and 'GNOME' in ansible_env.XDG_CURRENT_DESKTOP
  tags: ['system', 'theme']

### Keyboard Settings ###
- name: Set keyboard repeat settings
  dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "/org/gnome/desktop/peripherals/keyboard/delay", value: "250" }
    - { key: "/org/gnome/desktop/peripherals/keyboard/repeat-interval", value: "30" }
  when: ansible_env.XDG_CURRENT_DESKTOP is defined and 'GNOME' in ansible_env.XDG_CURRENT_DESKTOP
  tags: ['system', 'keyboard']

### Dotfiles Setup ###
- name: Ensure nix-darwin equivalent directory exists
  file:
    path: "{{ ansible_env.HOME }}/fedora-dotfiles"
    state: directory
    mode: '0755'
  tags: ['system', 'dotfiles']

- name: Create dotfiles symlink message
  debug:
    msg: "Please manually clone/copy your dotfiles to {{ ansible_env.HOME }}/fedora-dotfiles and run 'stow . -t ~' from that directory"
  tags: ['system', 'dotfiles']

### Desktop Environment Specific Tweaks ###
- name: Install GNOME Extensions (if GNOME)
  dnf:
    name:
      - gnome-extensions-app
      - gnome-tweaks
    state: present
  become: yes
  when: ansible_env.XDG_CURRENT_DESKTOP is defined and 'GNOME' in ansible_env.XDG_CURRENT_DESKTOP
  tags: ['system', 'gnome']

### Install multimedia codecs ###
- name: Install multimedia codecs
  dnf:
    name:
      - gstreamer1-plugins-{bad-*,good-*,base} 
      - gstreamer1-plugin-openh264 
      - gstreamer1-libav 
      - lame* 
      - --exclude=gstreamer1-plugins-bad-free-devel
    state: present
  become: yes
  tags: ['system', 'multimedia']