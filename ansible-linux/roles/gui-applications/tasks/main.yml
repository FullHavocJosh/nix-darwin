---
### GUI Applications via Flatpak ###
- name: Install development GUI applications
  flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - io.github.shiftey.Desktop  # GitHub Desktop alternative
    - com.sublimetext.three
    - org.kde.krita
    - com.jetbrains.GoLand
  tags: ['gui', 'development']

- name: Install web browsers
  flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - org.chromium.Chromium
    - io.github.zen_browser.zen
    - org.mozilla.firefox
    - com.brave.Browser
  tags: ['gui', 'browsers']

- name: Install media applications
  flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - org.videolan.VLC
    - com.spotify.Client
    - org.audacityteam.Audacity
  tags: ['gui', media']

- name: Install communication applications
  flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - com.discordapp.Discord
    - org.signal.Signal
    - com.slack.Slack
  tags: ['gui', 'communication']

- name: Install productivity applications
  flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - md.obsidian.Obsidian
    - org.libreoffice.LibreOffice
  tags: ['gui', 'productivity']

### Terminal Emulators ###
- name: Install terminal emulators (Fedora/RHEL)
  dnf:
    name:
      - alacritty
      - kitty
    state: present
  become: yes
  when: ansible_os_family == "RedHat"
  tags: ['gui', 'terminal']

- name: Install terminal emulators (Ubuntu/Debian)
  apt:
    name:
      - alacritty
      - kitty
    state: present
    update_cache: yes
  become: yes
  when: ansible_os_family == "Debian"
  tags: ['gui', 'terminal']

### Install fonts ###
- name: Install Nerd Fonts
  get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.0.2/{{ item }}.zip"
    dest: "/tmp/{{ item }}.zip"
  loop:
    - JetBrainsMono
    - Hack
  tags: ['gui', 'fonts']

- name: Create fonts directory
  file:
    path: "{{ ansible_env.HOME }}/.local/share/fonts"
    state: directory
    mode: '0755'
  tags: ['gui', 'fonts']

- name: Extract and install fonts
  unarchive:
    src: "/tmp/{{ item }}.zip"
    dest: "{{ ansible_env.HOME }}/.local/share/fonts"
    remote_src: yes
  loop:
    - JetBrainsMono
    - Hack
  notify: refresh font cache
  tags: ['gui', 'fonts']

- name: Clean up font archives
  file:
    path: "/tmp/{{ item }}.zip"
    state: absent
  loop:
    - JetBrainsMono
    - Hack
  tags: ['gui', 'fonts']